<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#16386e"/>
      <stop offset="46%" stop-color="#07142c"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#4fb8ff" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#4fb8ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4fb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="42%" stop-color="#8fd8ff"/>
      <stop offset="100%" stop-color="#2f8fe0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#04060d"/>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#core)"/>
  <g fill="none" stroke="#4fb8ff" stroke-opacity="0.16" stroke-width="1">
    <path d="M0 96H512M0 160H512M0 224H512M0 288H512M0 352H512M0 416H512"/>
    <path d="M96 0V512M160 0V512M224 0V512M288 0V512M352 0V512M416 0V512"/>
  </g>
  <rect x="70" y="70" width="372" height="372" fill="none" stroke="#5cc8ff" stroke-width="2" opacity="0.85" filter="url(#soft)"/>
  <rect x="84" y="84" width="344" height="344" fill="none" stroke="#8fd8ff" stroke-width="1" opacity="0.35"/>
  <g fill="none" stroke="#d7f1ff" stroke-width="12" stroke-linecap="square" filter="url(#glow)">
    <path d="M46 132V46H132"/>
    <path d="M380 46H466V132"/>
    <path d="M46 380V466H132"/>
    <path d="M380 466H466V380"/>
  </g>
  <g fill="none" stroke="#4fb8ff" stroke-width="4" stroke-linecap="square" opacity="0.9">
    <path d="M46 156V46H156"/>
    <path d="M356 46H466V156"/>
    <path d="M46 356V466H156"/>
    <path d="M356 466H466V356"/>
  </g>
  <!-- dungeon gate -->
  <g filter="url(#soft)">
    <path d="M196 318 V214 H316 V318" fill="none" stroke="#1a6ec4" stroke-width="22" stroke-linejoin="miter"/>
    <path d="M196 318 V214 H316 V318" fill="none" stroke="url(#sfill)" stroke-width="10" stroke-linejoin="miter"/>
    <path d="M214 246 h84 v56 h-84 z" fill="#071428" stroke="#8fd8ff" stroke-width="3"/>
    <path d="M256 252 v44" stroke="#4fb8ff" stroke-width="3" opacity="0.8"/>
    <circle cx="256" cy="274" r="10" fill="#8fd8ff"/>
  </g>
  <!-- walking loop around the gate, open at the arrow -->
  <path d="M318 168
           C 372 186, 398 230, 398 274
           C 398 352, 338 404, 256 404
           C 174 404, 114 352, 114 274
           C 114 230, 140 186, 194 168"
        fill="none"
        stroke="#0b3f86"
        stroke-width="46"
        stroke-linecap="round"
        opacity="0.55"/>
  <path d="M318 168
           C 372 186, 398 230, 398 274
           C 398 352, 338 404, 256 404
           C 174 404, 114 352, 114 274
           C 114 230, 140 186, 194 168"
        fill="none"
        stroke="url(#sfill)"
        stroke-width="30"
        stroke-linecap="round"
        filter="url(#glow)"/>
  <path d="M300 156
           C 348 170, 372 206, 372 246"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.55"/>
  <!-- direction arrow -->
  <path d="M214 150 L256 112 L292 156 L256 146 Z" fill="#eaf6ff" stroke="#2f8fe0" stroke-width="4" stroke-linejoin="round"/>
  <!-- start gate diamond -->
  <path d="M256 386 l18 18 -18 18 -18 -18 Z" fill="#eaf6ff" stroke="#1a6ec4" stroke-width="4"/>
</svg>
